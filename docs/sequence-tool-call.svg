<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Bella – Ablauf eines Tool-Aufrufs</title>
  <style>
    .bg { fill: #ffffff; }
    .p { fill: #f6f8fa; stroke: #d0d7de; }
    .pb { fill: #fff5f8; stroke: #e91e63; stroke-width: 2; }
    .ps { fill: #eef4fb; stroke: #0a6ed1; }
    .life { stroke: #d0d7de; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .m { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .r { stroke: #57606a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .note { fill: #fff5f8; stroke: #f48fb1; }
    .t { fill: #1f2328; font-size: 13px; }
    .h { fill: #1f2328; font-size: 14px; font-weight: 700; }
    .s { fill: #57606a; font-size: 12px; }
    .num { fill: #e91e63; }
    .numt { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .ah { fill: #57606a; }
    .bar { fill: #e91e63; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .p { fill: #161b22; stroke: #30363d; }
      .pb { fill: #2a1520; stroke: #f06292; }
      .ps { fill: #0c2135; stroke: #4493f8; }
      .life { stroke: #30363d; }
      .m, .r { stroke: #8b949e; }
      .note { fill: #2a1520; stroke: #b04a78; }
      .t, .h { fill: #e6edf3; }
      .s { fill: #8b949e; }
      .ah { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="640"/>

  <!-- participants -->
  <rect class="p" x="20" y="20" width="120" height="40" rx="8"/><text x="80" y="45" class="h" text-anchor="middle">Entwickler</text>
  <rect class="pb" x="220" y="20" width="120" height="40" rx="8"/><text x="280" y="45" class="h" text-anchor="middle">Bella</text>
  <rect class="p" x="420" y="20" width="120" height="40" rx="8"/><text x="480" y="45" class="h" text-anchor="middle">Claude API</text>
  <rect class="p" x="600" y="20" width="160" height="40" rx="8"/><text x="680" y="39" class="h" text-anchor="middle">ADT-Tools</text><text x="680" y="54" class="s" text-anchor="middle">oder ARC-1</text>
  <rect class="ps" x="820" y="20" width="120" height="40" rx="8"/><text x="880" y="45" class="h" text-anchor="middle">SAP-System</text>
  <path class="life" d="M80 60V570M280 60V570M480 60V570M680 60V570M880 60V570"/>

  <!-- 1 -->
  <path class="m" d="M80 100H278" marker-end="url(#a)"/>
  <circle cx="96" cy="88" r="8" class="num"/><text x="96" y="92" class="numt" text-anchor="middle">1</text>
  <text x="110" y="92" class="t">Frage + Editor-Kontext</text>
  <!-- 2 -->
  <path class="m" d="M280 142H478" marker-end="url(#a)"/>
  <circle cx="296" cy="130" r="8" class="num"/><text x="296" y="134" class="numt" text-anchor="middle">2</text>
  <text x="310" y="134" class="t">Prompt + Tool-Liste</text>
  <!-- 3 -->
  <path class="r" d="M480 184H282" marker-end="url(#a)"/>
  <circle cx="296" cy="172" r="8" class="num"/><text x="296" y="176" class="numt" text-anchor="middle">3</text>
  <text x="310" y="176" class="t">tool_use: adt_read_source</text>
  <!-- 4 note -->
  <rect class="note" x="150" y="202" width="300" height="52" rx="8"/>
  <circle cx="168" cy="218" r="8" class="num"/><text x="168" y="222" class="numt" text-anchor="middle">4</text>
  <text x="182" y="222" class="t">Tool-Policy: AUTO · CONFIRM · DENY</text>
  <text x="182" y="242" class="t">Router: Objekt im Editor offen?</text>
  <!-- 5 -->
  <path class="m" d="M280 290H678" marker-end="url(#a)"/>
  <circle cx="296" cy="278" r="8" class="num"/><text x="296" y="282" class="numt" text-anchor="middle">5</text>
  <text x="310" y="282" class="t">Tool ausführen</text>
  <!-- 6 -->
  <path class="m" d="M680 332H878" marker-end="url(#a)"/>
  <circle cx="696" cy="320" r="8" class="num"/><text x="696" y="324" class="numt" text-anchor="middle">6</text>
  <text x="710" y="324" class="t">ADT REST (Login des Projekts)</text>
  <!-- 7 -->
  <path class="r" d="M880 374H682" marker-end="url(#a)"/>
  <circle cx="696" cy="362" r="8" class="num"/><text x="696" y="366" class="numt" text-anchor="middle">7</text>
  <text x="710" y="366" class="t">Quelltext / Meldungen</text>
  <!-- 8 -->
  <path class="r" d="M680 416H282" marker-end="url(#a)"/>
  <circle cx="296" cy="404" r="8" class="num"/><text x="296" y="408" class="numt" text-anchor="middle">8</text>
  <text x="310" y="408" class="t">Ergebnis</text>
  <!-- 9 -->
  <path class="m" d="M280 458H478" marker-end="url(#a)"/>
  <circle cx="296" cy="446" r="8" class="num"/><text x="296" y="450" class="numt" text-anchor="middle">9</text>
  <text x="310" y="450" class="t">tool_result</text>
  <!-- 10 -->
  <path class="r" d="M480 500H282" marker-end="url(#a)"/>
  <circle cx="296" cy="488" r="8" class="num"/><text x="296" y="492" class="numt" text-anchor="middle">10</text>
  <text x="310" y="492" class="t">Antwort: Text + Code</text>
  <!-- 11 -->
  <path class="r" d="M280 542H82" marker-end="url(#a)"/>
  <circle cx="96" cy="530" r="8" class="num"/><text x="96" y="534" class="numt" text-anchor="middle">11</text>
  <text x="110" y="534" class="t">Antwort + Aktionen</text>

  <!-- footnote -->
  <rect class="bar" x="20" y="588" width="4" height="36"/>
  <text x="34" y="602" class="t">Ist das Objekt im Editor geöffnet, schreibt der Router in Schritt 4 in den Editor-Puffer (Diff-Vorschau, ungesichert).</text>
  <text x="34" y="620" class="t">Die Schritte 5 bis 7 entfallen dann; gesichert und aktiviert wird wie gewohnt in ADT.</text>
</svg>
