name: Release

# Publishes the update site as a GitHub Release, either by pushing a tag like
# v0.1.0 or via "Run workflow" (Actions tab) with the version number; the
# latter creates the tag itself.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 0.2.0 (must match pom.xml)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build update site and publish release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the project version
        run: |
          tag="${TAG#v}"
          # read from pom.xml: "mvn help:evaluate" can fail inside Tycho on a runner with an empty Maven cache
          version=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml | sed 's/-SNAPSHOT$//')
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match project version $version (pom.xml)"
            exit 1
          fi
      - name: Build, test and package the update site (incl. ADT integration)
        # Signs with PGP when the secret BELLA_GPG_KEY is set (fingerprint in the
        # variable BELLA_GPG_KEYNAME, optional passphrase in the secret
        # BELLA_GPG_PASSPHRASE); without it the release stays unsigned.
        env:
          BELLA_GPG_KEY: ${{ secrets.BELLA_GPG_KEY }}
          BELLA_GPG_KEYNAME: ${{ vars.BELLA_GPG_KEYNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.BELLA_GPG_PASSPHRASE }}
        run: releng/build-update-site.sh "bella-update-site-${TAG}.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Bella ${{ env.TAG }}
          files: bella-update-site-${{ env.TAG }}.zip
          generate_release_notes: true
          body: |
            Eclipse update site for Bella – AI assistant for ABAP.

            **Install:** Eclipse → *Help → Install New Software… → Add…* and either enter the update site
            ${{ vars.UPDATE_SITE_URL || 'https://bella.kilian-taubmann.de/' }} or choose *Archive…* and select `bella-update-site-${{ env.TAG }}.zip`.
            Tick both features (*Bella* and *Bella ADT integration*), restart, then set up Claude (API key or Claude subscription) under *Window → Preferences → Bella*.

            ${{ vars.BELLA_GPG_KEYNAME && format('Signed with PGP. Key fingerprint: `{0}`', vars.BELLA_GPG_KEYNAME) || '' }}

            Requires Eclipse 2026-09+ with Java 21 and SAP ABAP Development Tools. Bella uses the installed ADT and does not update it.

  pages:
    name: Publish update site on GitHub Pages
    needs: release
    if: vars.PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
