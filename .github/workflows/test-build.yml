name: Test build

# Every push to the branch "test" builds a signed update site and publishes it
# as the pre-release "test-build", replacing the previous one:
#   https://github.com/<owner>/<repo>/releases/download/test-build/bella-update-site-test.zip
# The tag must not be called "test" like the branch: GitHub then leaves the
# release an unpublished draft (shown as "untagged-…") without a download.
# It is never marked as latest release and never reaches the update site on
# GitHub Pages (pages.yml only takes regular releases).
on:
  push:
    branches: [ test ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  test-build:
    name: Build and publish test build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and package the update site (incl. ADT integration)
        env:
          BELLA_GPG_KEY: ${{ secrets.BELLA_GPG_KEY }}
          BELLA_GPG_KEYNAME: ${{ vars.BELLA_GPG_KEYNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.BELLA_GPG_PASSPHRASE }}
        run: releng/build-update-site.sh bella-update-site-test.zip
      - name: Replace the pre-release "test-build"
        env:
          GH_TOKEN: ${{ github.token }}
          KEYNAME: ${{ vars.BELLA_GPG_KEYNAME }}
        run: |
          short="${GITHUB_SHA::7}"
          version=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          {
            echo "**Test build, not for production use.** It is replaced by every push to the branch \`test\`."
            echo
            echo "Version ${version}, commit ${GITHUB_SHA} (branch \`${GITHUB_REF_NAME}\`)."
            echo
            echo "**Install:** Eclipse → *Help → Install New Software… → Add… → Archive…* and select \`bella-update-site-test.zip\`."
            if [ -n "$KEYNAME" ]; then
              echo
              echo "Signed with PGP. Key fingerprint: \`${KEYNAME}\`"
            fi
          } > notes.md
          # earlier test builds used the tag "test", the branch's name; remove those releases and the tag
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "test" or .tag_name == "test-build") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/test" 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/test-build" 2>/dev/null || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/test-build -f sha="$GITHUB_SHA" >/dev/null
          gh release create test-build bella-update-site-test.zip --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --latest=false \
            --title "Bella test build (${short})" --notes-file notes.md
          # a release that stays a draft has no public download; fail instead of reporting success
          if [ "$(gh release view test-build --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::The release test-build is still a draft"
            exit 1
          fi
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/test-build/bella-update-site-test.zip"
