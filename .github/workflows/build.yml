name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

jobs:
  core-and-ui:
    name: Core, UI and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check translations
        run: python3 releng/i18n/generate.py && git diff --exit-code
      - name: Build and test
        run: xvfb-run -a mvn -B -ntp verify

  with-adt:
    name: Full build incl. ADT integration and update site
    runs-on: ubuntu-latest
    needs: core-and-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with ADT (SAP tools p2 repository)
        run: mvn -B -ntp -Padt verify -DskipTests
      - name: Show ADT REST resource overloads (diagnostics)
        run: |
          for jar in $(find ~/.m2/repository -name 'com.sap.adt.communication*.jar'); do
            if unzip -l "$jar" | grep -q 'com/sap/adt/communication/resources/IRestResource.class'; then
              echo "$jar"
              javap -cp "$jar" com.sap.adt.communication.resources.IRestResource | grep -E ' (get|post|put|delete)\(' || true
            fi
          done
      - name: Upload update site
        uses: actions/upload-artifact@v4
        with:
          name: bella-update-site
          path: releng/de.kiliantaubmann.bella.updatesite/target/repository/
